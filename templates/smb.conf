# =============================================================================
# Managed by nas-deployment-manager  -  NO editar a mano: se regenera al instalar.
# Los @@MARCADORES@@ se sustituyen con los valores de config/*.conf.
# =============================================================================

[global]
   # Grupo de trabajo (el predeterminado de Windows es WORKGROUP).
   workgroup = @@SMB_WORKGROUP@@
   # Descripción que ven los clientes en la red.
   server string = @@SMB_SERVER_STRING@@
   # Servidor independiente (sin dominio Active Directory).
   server role = standalone server
   # Autenticación por usuario; el invitado se gestiona con "map to guest".
   security = user
   # Todo usuario desconocido o sin credenciales entra como invitado (guest).
   map to guest = Bad User
   # Cuenta del sistema a la que se mapea el invitado.
   guest account = nobody

   # Solo la red local (y el propio equipo) puede conectar; el resto se rechaza.
   hosts allow = 127.0.0.1 @@LAN_CIDR@@
   hosts deny = ALL

   # Registro de actividad: un archivo por cliente, con rotación.
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

   # No hay impresoras: se desactiva para reducir ruido y superficie.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

# ----------------------------- Recurso compartido ----------------------------
[@@SMB_SHARE_NAME@@]
   comment = Almacenamiento NAS
   # Carpeta en el disco montado.
   path = @@NAS_SHARE_DIR@@
   # Visible al listar el servidor.
   browseable = yes
   # Escritura permitida.
   read only = no
   # ACCESO LIBRE: no pide usuario ni contraseña (Sprint 1, solo red local).
   guest ok = yes
   # Todo se guarda como nobody:nogroup, coherente con los permisos de la carpeta.
   force user = nobody
   force group = nogroup
   # Permisos de archivos y carpetas nuevos: lectura/escritura para todos.
   create mask = 0666
   directory mask = 0777