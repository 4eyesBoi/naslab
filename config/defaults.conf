#!/usr/bin/env bash
# =============================================================================
# config/defaults.conf  -  Configuración general (se carga con "source")
# -----------------------------------------------------------------------------
# Patrón usado:  VARIABLE="${VARIABLE:-valor_por_defecto}"
#   -> si la variable ya viene del entorno (sudo VAR=x ./install.sh) se respeta;
#      si no, se usa el valor por defecto. Así se puede cambiar sin editar el archivo.
# =============================================================================

# PROJECT_DIR lo define quien nos carga; si falta, abortamos con un mensaje claro.
: "${PROJECT_DIR:?PROJECT_DIR no está definido (este archivo se carga desde install.sh)}"

# ---------------------------- Almacenamiento ---------------------------------
# Dónde se monta el disco de datos.
NAS_MOUNT_POINT="${NAS_MOUNT_POINT:-/mnt/nas-storage}"
# Etiqueta del sistema de archivos. También sirve para RECONOCER el disco en
# ejecuciones posteriores (idempotencia).
NAS_FS_LABEL="${NAS_FS_LABEL:-nas-storage}"
# Disco/partición a usar. Vacío = autodetectar UN disco secundario libre.
NAS_DISK="${NAS_DISK:-}"
# Carpeta que se comparte (dentro del disco montado).
NAS_SHARE_DIR="${NAS_SHARE_DIR:-${NAS_MOUNT_POINT}/compartido}"

# -------------------------------- Samba --------------------------------------
SMB_SHARE_NAME="${SMB_SHARE_NAME:-NAS}"                     # nombre visible del recurso
SMB_WORKGROUP="${SMB_WORKGROUP:-WORKGROUP}"                 # grupo de trabajo Windows
SMB_SERVER_STRING="${SMB_SERVER_STRING:-NAS Ubuntu Server}" # descripción del servidor

# ------------------------- Módulos opcionales (yes/no) -----------------------
ENABLE_NFS="${ENABLE_NFS:-no}"            # exportar también por NFS
ENABLE_FIREWALL="${ENABLE_FIREWALL:-no}"  # configurar UFW (ver docs antes de activar)
ENABLE_BACKUP="${ENABLE_BACKUP:-no}"      # copias programadas con rsync

# ------------------------------- Backups -------------------------------------
BACKUP_DIR="${BACKUP_DIR:-${NAS_MOUNT_POINT}/backups}"  # NO se comparte por Samba
BACKUP_KEEP="${BACKUP_KEEP:-7}"                         # cuántas copias conservar
BACKUP_CRON_SCHEDULE="${BACKUP_CRON_SCHEDULE:-30 2 * * *}"  # diario 02:30

# ------------------------------- Licencia ------------------------------------
LICENSE_REQUIRED="${LICENSE_REQUIRED:-no}"              # en Sprint 1: desactivada
LICENSE_DIR="${LICENSE_DIR:-/etc/nas-deployment-manager}"

# -------------------------------- Logs ---------------------------------------
LOG_DIR="${LOG_DIR:-${PROJECT_DIR}/logs}"
LOG_FILE="${LOG_FILE:-${LOG_DIR}/nas-$(date +%Y%m%d).log}"